[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[project]
name = "coding_copilot"
version = "0.1.0"
description = "coding_copilot project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langgraph>=1.0.2",
    "langchain>=1.0.3",
    "langchain-core>=1.0.2",
    "langchain-openai>=1.0.1",
    "langchain-anthropic>=1.0.1",
    "langchain-mcp-adapters==0.1.11",
    "langgraph-supervisor==0.0.30",
    "readabilipy>=0.3.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.119.1",
    "uvicorn>=0.38.0",
    "sse-starlette>=3.0.2",
    "numpy>=2.2.3",
    "yfinance>=0.2.54",
    "json-repair<=0.41.0",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.0",
    "dashscope>=1.24.2",
    "py-spy>=0.3.14",
    "nest-asyncio>=1.6.0",
    "injector==0.22.0",
]

[project.scripts]
coding-copilot = "src.cli.main:main"

[project.optional-dependencies]
dev = [
    "black>=24.2.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
^/build/
'''
